# Gitling on Cloudflare: ONE Worker serves the web app (static assets) and sign-in (/auth/*, /health).
# Deploy: `npm run deploy` at the repo root (builds the app, then deploys). See docs/DEPLOY.md.
name = "gitling"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Don't delete variables added in the Cloudflare dashboard on deploy (a plain-text GITHUB_CLIENT_SECRET was
# wiped once this way). The secret should still be stored as type "Secret", which deploys never touch.
keep_vars = true

[assets]
# The PWA built by `npm run build:web`. Unknown paths fall back to index.html (single-page app).
directory = "../../apps/app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only these paths reach the Worker code; everything else is served straight from the assets.
run_worker_first = ["/auth/*", "/health"]

[vars]
# Comma-separated places the worker may send people back to after GitHub approves.
# http(s) entries match by exact origin; scheme entries (gitling://, exp://) match by scheme.
# The deployed origin (https://gitling.<subdomain>.workers.dev) must be listed here.
# No localhost here: any program listening on a visitor's localhost:8081 could otherwise receive their sign-in
# code (and get CORS on /auth/exchange). Local dev signs in with a pasted token, or add localhost to a dev
# Worker of your own. gitling:// is pinned to the exact callback path.
ALLOWED_RETURN = "https://gitling.truckcoding.workers.dev,gitling://auth/callback"
# The GitHub OAuth App's client ID (public).
GITHUB_CLIENT_ID = "Ov23likikLApWz5YvJtj"

# Secret, never in this file:  npx wrangler@4 secret put GITHUB_CLIENT_SECRET -c services/edge/wrangler.toml

# Caps code exchanges per visitor IP (Cloudflare Workers rate limiting binding). The Worker skips the check
# when the binding is missing (tests, older deploys).
[[ratelimits]]
name = "EXCHANGE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60
