# Gitling on Cloudflare: ONE Worker serves the web app (static assets) and sign-in (/auth/*, /health).
# Deploy: `npm run deploy` at the repo root (builds the app, then deploys). See docs/DEPLOY.md.
name = "gitling"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[assets]
# The PWA built by `npm run build:web`. Unknown paths fall back to index.html (single-page app).
directory = "../../apps/app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only these paths reach the Worker code; everything else is served straight from the assets.
run_worker_first = ["/auth/*", "/health"]

[vars]
# Comma-separated places the worker may send people back to after GitHub approves.
# http(s) entries match by exact origin; scheme entries (gitling://, exp://) match by scheme.
# The deployed origin (https://gitling.<subdomain>.workers.dev) must be listed here.
ALLOWED_RETURN = "https://gitling.truckcoding.workers.dev,http://localhost:8081,gitling://"
# The GitHub OAuth App's client ID (public).
GITHUB_CLIENT_ID = "Ov23likikLApWz5YvJtj"

# Secret, never in this file:  npx wrangler@4 secret put GITHUB_CLIENT_SECRET -c services/edge/wrangler.toml
