name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only builds and tests.
permissions:
  contents: read

jobs:
  check:
    # Windows too: path bugs (URL.pathname → "D:\D:\…", "/" vs "\" in pwa.mjs) once broke every script and
    # shipped a blank app from Windows builds, and only Linux was tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run e2e:signin
      - run: npm run e2e:studio
      - run: npm run e2e:review
      - run: npm run e2e:onboarding
      - run: npm run e2e:authenticator
      - name: Coverage (unit + fuzz)
        # Also after an earlier step failed, so the report is there to look at.
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
