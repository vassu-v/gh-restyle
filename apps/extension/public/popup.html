<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gitling</title>
<style>
  @font-face { font-family: "Gitling Geist"; src: url("fonts/Geist_400Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Gitling Geist"; src: url("fonts/Geist_600SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "Gitling Geist Mono"; src: url("fonts/GeistMono_400Regular.ttf"); }
  @font-face { font-family: "Gitling Doto"; src: url("fonts/Doto_800ExtraBold.ttf"); font-weight: 800; }
  :root { --bg: #0E0F11; --el: #16171A; --el2: #1E1F23; --line: #25262B; --fg: #ECECEE; --mut: #8D8F96; --acc: #A8B8FF; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 280px; padding: 14px; background: var(--bg); color: var(--fg); font: 14px/1.45 "Gitling Geist", system-ui, sans-serif; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .word { font: 800 18px/1 "Gitling Doto", monospace; letter-spacing: .14em; color: var(--acc); }
  .card { margin-top: 12px; padding: 12px; border-radius: 16px; background: var(--el); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .dots { display: flex; gap: 4px; } .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #ffffff22; }
  .name { font-weight: 600; } .state { font: 12px "Gitling Geist Mono", monospace; color: var(--mut); }
  .btn { margin-top: 10px; width: 100%; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--el2); color: var(--fg); font: 500 14px "Gitling Geist", sans-serif; cursor: pointer; }
  .switch { position: relative; width: 42px; height: 26px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #33343A; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--acc); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--acc); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="top"><span class="word">GITLING</span><label class="switch" title="Restyle GitHub"><input type="checkbox" id="enabled" role="switch" aria-label="Restyle GitHub"><span></span></label></div>
  <div class="card"><span class="dots" id="dots"></span><div><div class="name" id="name">Signal</div><div class="state" id="state"></div></div></div>
  <button class="btn" id="settings">Settings: look, presets, design files</button>
  <script src="popup.js"></script>
</body>
</html>
